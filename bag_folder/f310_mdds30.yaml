joy_node:
  ros__parameters:
    deadzone: 0.10
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 2
    enable_turbo_button: 5

    axis_linear:
      x: 1
    scale_linear:
      x: 0.4
    scale_linear_turbo:
      x: 0.4

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 5.0
    scale_angular_turbo:
      yaw: 5.0
